name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub (requires a matching signed version tag)
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub release as a prerelease
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate publication tag
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py check-tag

  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: .release
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          options=()
          if [ "$PRERELEASE" = "false" ]; then options+=(--stable); fi
          python3 scripts/release.py publish "${options[@]}"
