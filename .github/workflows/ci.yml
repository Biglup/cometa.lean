name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          build: false
          test: false
      - name: Install check tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-18 valgrind
      - name: Prepare pinned native library
        run: python3 scripts/setup-native.py
      - name: Check source conventions
        run: |
          python3 scripts/check-source.py
          clang-format-18 --dry-run --Werror cbits/cometa_lean.c
      - name: Build and test
        run: |
          lake build cometaTests inspectAddress
          lake test
          lake lean Tests/Invariants.lean
          lake env leanchecker Cometa.Plan
          python3 scripts/check-consumer.py
      - name: Check native memory ownership
        run: >-
          lake env valgrind --leak-check=full --errors-for-leak-kinds=definite
          --error-exitcode=99 .lake/build/bin/cometaTests
      - name: Build API reference
        working-directory: docbuild
        env:
          DOCGEN_SRC: file
        run: lake build Cometa:docs
